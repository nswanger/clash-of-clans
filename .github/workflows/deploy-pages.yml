name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_CLAN_TAG: ${{ vars.VITE_CLAN_TAG }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || format('/{0}/', github.event.repository.name) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Validate public build configuration
        shell: bash
        run: |
          missing_configuration=0
          for variable_name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_CLAN_TAG; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Required GitHub Actions repository variable ${variable_name} is not configured."
              missing_configuration=1
            fi
          done
          exit "${missing_configuration}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The half-finished rename is the one failure mode the test suite
      # structurally cannot see: no test queries by class name, which is exactly
      # what makes a restyle invisible to it (#25).
      - name: Assert the Clan Muster migration left no legacy prefix
        shell: bash
        run: |
          legacy_prefix="cwl-$(printf 'proto')-"
          if grep -rqF "${legacy_prefix}" apps/web/src; then
            echo "::error::${legacy_prefix} survives in apps/web/src; the wave-2 rename is incomplete."
            grep -rnF "${legacy_prefix}" apps/web/src
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Nothing ran this suite until now, which is how two specs sat stale
      # through a whole wave of rebuilds while the app's default route lost all
      # browser-level coverage (#63). Both Playwright projects — Desktop Chrome
      # and iPhone 13 — are Chromium, so one browser covers the matrix, and the
      # 26 tests take under ten seconds.
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end test
        run: pnpm e2e

      - name: Build
        run: pnpm build

      - name: Scan Pages artifact for collector secrets
        shell: bash
        run: |
          forbidden_pattern='SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SECRET_KEY|CLASH_API_TOKEN|sb_secret_'
          if grep --recursive --files-with-matches --binary-files=text --extended-regexp "${forbidden_pattern}" apps/web/dist >/dev/null; then
            echo "::error::The Pages artifact contains a collector-only secret name or secret-key prefix."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

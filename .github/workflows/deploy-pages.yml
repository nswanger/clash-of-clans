name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The build steps live in checks.yml so pr.yml runs the same ones (#68).
  # This caller adds the Pages artifact upload the deploy consumes.
  build:
    uses: ./.github/workflows/checks.yml
    with:
      upload-pages-artifact: true
    # The migrations job needs SUPABASE_MIGRATION_AUDIT_URL; a reusable workflow
    # is handed nothing unless the caller says so. `deploy` needs `build`, so an
    # unapplied migration blocks the publish rather than shipping a surface
    # against schema the database does not have (#65).
    secrets: inherit

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
